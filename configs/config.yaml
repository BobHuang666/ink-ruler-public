server:
  port: "8080"
  mode: "debug" # debug, release, test
  read_timeout: 30
  write_timeout: 30

database:
  host: "localhost"
  port: 3306
  user: "root"
  password: "" # 从环境变量 DB_PASSWORD 读取
  dbname: "ink-ruler"
  charset: "utf8mb4"
  max_open_conns: 100
  max_idle_conns: 10

jwt:
  secret: "your-secret-key-change-in-production" # 从环境变量 JWT_SECRET 读取
  expire_time: 24 # 小时

smtp:
  host: "smtp.163.com"       # 如 smtp.qq.com、smtp.163.com
  port: 465      # 465(SSL) 或 587(TLS)
  user: "Inkruler_notify@163.com"
  password: ""    # 邮箱授权码，非登录密码
  from: "Inkruler_notify@163.com"        # 发件人地址

# 智能搜索（智能增强 + 语义检索）使用的 SiliconFlow API
llm:
  api_key: ""           # 必填，建议用环境变量 SILICONFLOW_API_KEY 覆盖
  chat_model: "THUDM/GLM-4-9B-0414"
  vision_model: "PaddlePaddle/PaddleOCR-VL-1.5"  # OCR 图片/PDF 识别，与 api_key 共用
  embedding_model: "BAAI/bge-large-zh-v1.5"
  reranker_model: "BAAI/bge-reranker-v2-m3"
  chat_url: "https://api.siliconflow.cn/v1/chat/completions"
  embed_url: "https://api.siliconflow.cn/v1/embeddings"
  rerank_url: "https://api.siliconflow.cn/v1/rerank"
  timeout_seconds: 60    # 作文批改解析可能需要较长时间，建议 60-120 秒
  similarity_threshold: 0.4    # 余弦相似度粗筛阈值
  rerank_score_threshold: 0.2 # 精排分数阈值
  top_k_candidates: 100
  rerank_batch_size: 25

# 作文批改 GPU 网关（空则走 mock）；Ollama 批改可能需 3–5 分钟
gpu:
  gateway_url: ""
  request_timeout_seconds: 300
